<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OAU Lost & Found - Campus Feed</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="logo">
      <img src="logo.png" alt="OAU Logo" class="school-logo" />
      <span>OAU Lost & Found</span>
    </div>

    <!-- Header Search Bar -->
    <div class="header-search">
      <input type="text" id="search-input" placeholder="🔍 Search missing or found items..." />
    </div>

    <div class="nav-right">
      <a href="index.html" class="nav-link active">Home (Feed)</a>
      <a href="report.html" class="action-btn">➕ Report Hub</a>

      <button onclick="checkAdminAccess()" class="admin-btn">🔑 Admin</button>
      <span id="user-display"></span>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </header>

  <main class="main-container">
    
    <!-- Campus Feed Section -->
    <section class="card-section" id="fyp-section">
      <div class="feed-header-controls">
        <h2>Campus Feed (FYP)</h2>
        
        <!-- Filter Controls -->
        <div class="filter-container">
          <select id="category-filter">
            <option value="all">All Items</option>
            <option value="missing">Missing Items Only</option>
            <option value="found">Found Items Only</option>
          </select>
        </div>
      </div>

      <div class="feed-container">
        <!-- Dynamic posts load here via Firebase -->
      </div>
    </section>

  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
