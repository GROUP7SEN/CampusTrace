  <!-- Login Form Container -->
  <main class="main-container">
    <section class="card-section">
      <h2>Student Login</h2>
      <p class="subtitle">Enter your OAU details to access the Lost & Found portal.</p>

      <form id="login-form">
        <!-- Inside the <form id="login-form"> in login.html -->
<label for="full-name"><strong>Full Name:</strong></label>
<input 
  type="text" 
  id="full-name" 
  placeholder="e.g., John Doe" 
  required 
/>

<label for="matric-no"><strong>Matriculation Number:</strong></label>
<input 
  type="text" 
  id="matric-no" 
  placeholder="e.g., ABC/2021/001" 
  required 
/>

<label for="school-email"><strong>School Email:</strong></label>
<input 
  type="email" 
  id="school-email" 
  placeholder="e.g., student@student.oauife" 
  pattern="^[a-zA-Z0-9._%+-]+@student\.oauife$" 
  title="Please enter a valid school email ending in @student.oauife"
  required 
/>

<button type="submit">Login</button>
      </form>
    </section>
  </main>

  <script>
  // Handle Login Form Submission
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();

    const fullName = document.getElementById('full-name').value;
    const matricNo = document.getElementById('matric-no').value;
    const schoolEmail = document.getElementById('school-email').value.trim().toLowerCase();

    // Strict domain check (MUST be before localStorage saving)
    if (!schoolEmail.endsWith('@student.oauife')) {
      alert('Access Denied: Only valid school emails ending with @student.oauife are permitted.');
      return;
    }

    // Save details to LocalStorage
    localStorage.setItem('userName', fullName);
    localStorage.setItem('userMatric', matricNo);
    localStorage.setItem('userEmail', schoolEmail);

    alert('Login successful!');
    window.location.href = 'index.html';
  });
</script>
</body>
